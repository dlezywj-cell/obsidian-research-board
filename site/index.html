<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="投资研究知识看板" />
    <title>投资研究知识看板</title>
    <link rel="stylesheet" href="styles.css?v=iphone13pm-7" />
    <link rel="stylesheet" href="mobile.css?v=iphone13pm-7" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="hero-main">
          <div>
            <p class="eyebrow">RESEARCH LIBRARY</p>
            <h1>投资研究知识看板</h1>
            <p id="summary" class="subtitle">正在加载已公开的研究笔记…</p>
          </div>
          <section class="research-summary" aria-label="研究分布">
            <p class="summary-label">研究分布</p>
            <div id="stats" class="stats"></div>
          </section>
        </div>
        <div class="hero-footer">
          <p class="scope">仅收录：公司研究、行业研究、已处理的信息卡片</p>
          <div class="hero-tools"><button id="sync-settings" class="sync-settings" type="button">同步阅读进度</button><p class="updated" id="updated"></p></div>
        </div>
      </header>
      <section class="controls" aria-label="检索与筛选">
        <label class="search"><span>搜索</span><input id="search" type="search" placeholder="公司、行业、主题或正文" autocomplete="off" /></label>
        <div id="filters" class="filters" role="group" aria-label="分类筛选"></div>
      </section>
      <section class="notes-area" aria-live="polite">
        <p id="result-count" class="result-count"></p>
        <div id="notes" class="notes"></div>
      </section>
    </main>
    <dialog id="note-dialog">
      <div class="dialog-actions">
        <button id="close" class="close" aria-label="关闭笔记"><span aria-hidden="true">×</span></button>
      </div>
      <article>
        <div id="note-detail"></div>
      </article>
    </dialog>
    <dialog id="sync-dialog" class="sync-dialog">
      <form id="sync-form" method="dialog">
        <p class="eyebrow">READING SYNC</p>
        <h2>同步阅读进度</h2>
        <p>设置一个仅供自己使用的同步码；在电脑和手机输入同一同步码，已读状态就会自动同步。</p>
        <label>同步码<input id="sync-code" type="password" minlength="12" autocomplete="new-password" placeholder="至少 12 个字符" required /></label>
        <p id="sync-error" class="sync-error" aria-live="polite"></p>
        <div class="sync-actions"><button id="sync-cancel" class="secondary" type="button">暂不设置</button><button class="primary" type="submit">保存并同步</button></div>
      </form>
    </dialog>
    <script type="module" src="app.js?v=iphone13pm-7"></script>
  </body>
</html>
